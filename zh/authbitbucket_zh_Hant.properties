property.category.security.bitbucket=Bitbucket
property.category.security.bitbucket.description=若要啟用 Bitbucket 驗證：<ul><li>SonarQube 必須只能透過 HTTPS 公開存取</li><li>必須將屬性 'sonar.core.serverBaseURL' 設為這個公開的 HTTPS URL</li><li>在您的 Bitbucket 個人資料中，需要建立一個 OAuth consumer，其「Callback URL」必須設為 <code>'&lt;value_of_sonar.core.serverBaseURL_property&gt;/oauth2/callback'</code>，且權限須設為 Account:Read</li></ul>
