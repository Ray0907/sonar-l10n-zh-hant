settings.mode.mqr.name=Multi-Quality Rule (MQR) Mode
settings.mode.standard.description.line1=涵蓋規則類型的傳統用法，例如 Bug、Code Smell 與漏洞，每條規則只有單一類別與嚴重性等級。
settings.mode.standard.description.line2=此方式著重於依據規則影響最大的單一軟體品質（例如安全性、可靠性或可維護性），為規則及其問題指派嚴重性。這是 {productName} 9.9 LTA 及更早版本使用的規則分類方式。
settings.mode.mqr.description.line1=目的是更準確地呈現問題對所有軟體品質的影響。很少有問題只影響單一軟體品質。例如，大多數漏洞同時也是 Bug，反之亦然。MQR 模式會將每條規則對應到它所影響的每項品質，並為每項品質分別評定嚴重性。 
settings.mode.mqr.description.line2=此方式著重於清楚呈現問題對所有軟體品質的影響，而不只是最嚴重的那一項。
settings.mode.save.warning=儲存變更後，即可在您的實體中看到變更
