mode_tour.name=Standard Experience 與 MQR 模式導覽
mode_tour.link=在文件中進一步了解這些模式
mode_tour.step1.title=歡迎使用 SonarQube Server {version}！
mode_tour.step1.img_alt=以視覺方式呈現兩種新模式中問題的差異
mode_tour.step1.description=<p1>我們推出了兩種模式：<b>Standard Experience</b> 與 <b>Multi-Quality Rule (MQR) Mode</b>，讓您與團隊可以繼續使用熟悉的工作流程，或探索新的概念。</p1><p>參加此導覽，了解兩者之間的差異。</p>
mode_tour.step2.title=Standard Experience
mode_tour.step2.img_alt=以視覺方式呈現 Standard Experience 徽章的新外觀：漏洞、Bug 與 Code Smell
mode_tour.step2.description=<p1>Standard Experience 使用 <b>漏洞</b>、<b>Bug</b> 與 <b>Code Smell</b> 等規則類型。每條規則都只有單一類型與嚴重性等級，只要具備適當權限，即可自訂。</p1><p>此做法依據規則影響最顯著的單一軟體品質（例如安全性、可靠性或可維護性），為規則指派嚴重性。</p>
mode_tour.step3.title=Multi-Quality Rule Mode
mode_tour.step3.img_alt=以視覺方式呈現新的軟體品質徽章：安全性、可靠性與可維護性，以及它們與對應 Standard Experience 徽章的關聯
mode_tour.step3.description=<p1>新的 Multi-Quality Rule Mode 旨在更準確地呈現問題對所有軟體品質的影響。</p1><p>做法是針對每項軟體品質（安全性、可靠性與可維護性）分別為規則指派嚴重性，取代原本的類型（漏洞、Bug 與 Code Smell）。只要具備適當權限，即可自訂嚴重性等級。</p><p>此做法著重於清楚呈現對所有軟體品質的影響，而非只有受影響最嚴重的那一項。</p>
mode_tour.step4.title=切換模式
mode_tour.step4.img_alt=以視覺方式呈現在管理設定中切換 Standard Experience 與 MQR 模式
mode_tour.step4.description=<p1>您目前處於 <b>{mode}</b>。</p1><p>具備足夠權限者可前往「管理 > 設定 > 一般設定 > 模式」變更。</p><p>您的實體將以最接近您升級前軟體版本的模式啟動。</p>
mode_tour.step5.title=您可以從說明區段重新播放導覽
