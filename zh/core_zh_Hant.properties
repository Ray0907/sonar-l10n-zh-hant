component_measures.overview.project_overview.title=風險
component_measures.overview.project_overview.description=快速掌握營運風險。對於使用鍵盤操作的使用者，元素會依各檔案的程式碼行數排序。綠色以外的任何顏色都代表立即的風險：應該檢查的 Bug 或漏洞。位於圖表上方或右方的位置表示長期健康狀況可能有風險。位於左下方的綠色泡泡最理想。
component_measures.overview.Reliability.description=檢視 Bug 的營運風險。對於使用鍵盤操作的使用者，元素會依各檔案的 Bug 數量排序。泡泡顏色越接近紅色，最嚴重的 Bug 就越嚴重。泡泡大小代表 Bug 數量，每個泡泡的垂直位置則反映處理這些 Bug 的預估時間。位於底部邊緣的綠色小泡泡最理想。
component_measures.overview.Security.description=檢視漏洞的營運風險。對於使用鍵盤操作的使用者，元素會依各檔案的漏洞數量排序。泡泡顏色越接近紅色，最嚴重的漏洞就越嚴重。泡泡大小代表漏洞數量，每個泡泡的垂直位置則反映處理這些漏洞的預估時間。位於底部邊緣的綠色小泡泡最理想。
component_measures.overview.Maintainability.description=檢視 Code Smell 的長期風險。對於使用鍵盤操作的使用者，元素會依各檔案的 Code Smell 數量排序。泡泡顏色越接近紅色，技術債比率就越高。泡泡大小代表 Code Smell 數量，每個泡泡的垂直位置則反映處理這些 Code Smell 的預估時間。位於底部邊緣的綠色小泡泡最理想。
component_measures.overview.Coverage.description=檢視缺少測試覆蓋率的長期風險。對於使用鍵盤操作的使用者，元素會依各檔案未覆蓋的行數排序。泡泡大小代表未覆蓋的行數，每個泡泡的垂直位置則反映缺少的覆蓋率。位於底部邊緣的小泡泡最理想。
component_measures.overview.Duplications.description=檢視重複的長期風險。對於使用鍵盤操作的使用者，元素會依各檔案的重複區塊數量排序。泡泡大小代表重複區塊的數量，每個泡泡的垂直位置則反映這些區塊中的行數。位於底部邊緣的小泡泡最理想。
component_measures.overview.see_data_as_list=以清單檢視此圖表呈現的資料
