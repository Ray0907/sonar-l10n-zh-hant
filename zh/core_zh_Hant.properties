issue.clean_code_attribute_category.RESPONSIBLE.title=這是責任性問題。
issue.clean_code_attribute_category.RESPONSIBLE.advice=為了負起責任，程式碼必須考量其在資料方面的道德義務，以及對社會規範的潛在影響。
issue.clean_code_attribute=Clean Code 屬性
issue.clean_code_attribute.CLEAR=不清楚
issue.clean_code_attribute.CLEAR.title=這是意圖性問題，程式碼不夠清楚。
issue.clean_code_attribute.CLEAR.advice=為了清楚，程式碼需能自我說明，並清楚傳達其功能。
issue.clean_code_attribute.COMPLETE=不完整
issue.clean_code_attribute.COMPLETE.title=這是意圖性問題，程式碼不夠完整。
issue.clean_code_attribute.COMPLETE.advice=為了完整，程式碼必須能正常運作，並透過全面、適當且周延的程式碼結構達成其隱含目標。
issue.clean_code_attribute.CONVENTIONAL=不符慣例
issue.clean_code_attribute.CONVENTIONAL.title=這是一致性問題，程式碼不夠符合慣例。
issue.clean_code_attribute.CONVENTIONAL.advice=為了符合慣例，程式碼需以預期的指令執行工作，並在面對同樣好的選項時，於所有地方採用同一種選擇。
issue.clean_code_attribute.DISTINCT=不獨特
issue.clean_code_attribute.DISTINCT.title=這是適應性問題，程式碼不夠獨特。
issue.clean_code_attribute.DISTINCT.advice=為了獨特，程式碼的處理邏輯與資料需獨一無二且具區別性，沒有不必要的重複。
issue.clean_code_attribute.EFFICIENT=沒有效率
issue.clean_code_attribute.EFFICIENT.title=這是意圖性問題，程式碼不夠有效率。
issue.clean_code_attribute.EFFICIENT.advice=為了有效率，程式碼使用資源時需避免不必要的浪費，並在可行時優先採用經濟的選項。
issue.clean_code_attribute.FOCUSED=不專注
issue.clean_code_attribute.FOCUSED.title=這是適應性問題，程式碼不夠專注。
issue.clean_code_attribute.FOCUSED.advice=為了專注，程式碼需有單一、狹窄且明確的範圍。其每個單元都應只有一個簡潔的目的。
issue.clean_code_attribute.FORMATTED=未格式化
issue.clean_code_attribute.FORMATTED.title=這是一致性問題，程式碼的格式化不足。
issue.clean_code_attribute.FORMATTED.advice=為了格式一致，程式碼需以系統化且規律的方式呈現，並在整個程式碼庫中採用相同的非語意選擇。
issue.clean_code_attribute.IDENTIFIABLE=不易識別
issue.clean_code_attribute.IDENTIFIABLE.title=這是一致性問題，程式碼不夠容易識別。
issue.clean_code_attribute.IDENTIFIABLE.advice=為了容易識別，程式碼需包含依照語言慣例、結構規律的名稱與識別碼。
issue.clean_code_attribute.LAWFUL=不合法
issue.clean_code_attribute.LAWFUL.title=這是責任性問題，程式碼不夠合法。
issue.clean_code_attribute.LAWFUL.advice=為了合法，程式碼需遵守授權與著作權規範。
issue.clean_code_attribute.LOGICAL=不合邏輯
issue.clean_code_attribute.LOGICAL.title=這是意圖性問題，程式碼不夠合乎邏輯。
issue.clean_code_attribute.LOGICAL.advice=為了合乎邏輯，程式碼需有格式正確、合理且能相互配合的指令，並且沒有明顯的錯誤。
issue.clean_code_attribute.MODULAR=未模組化
issue.clean_code_attribute.MODULAR.title=這是適應性問題，程式碼不夠模組化。
issue.clean_code_attribute.MODULAR.advice=為了模組化，程式碼需經過組織與分布，以強調各部分之間的區隔。
issue.clean_code_attribute.RESPECTFUL=不尊重
issue.clean_code_attribute.RESPECTFUL.title=這是責任性問題，程式碼不夠尊重他人。
issue.clean_code_attribute.RESPECTFUL.advice=為了尊重他人，程式碼需避免使用歧視性與冒犯性的用語。
issue.clean_code_attribute.TESTED=未測試
issue.clean_code_attribute.TESTED.title=這是適應性問題，程式碼的測試不足。
issue.clean_code_attribute.TESTED.advice=為了經過測試，程式碼需有自動化的功能測試，以提供對功能的信心。
issue.clean_code_attribute.TRUSTWORTHY=不可信
issue.clean_code_attribute.TRUSTWORTHY.title=這是責任性問題，程式碼不夠可信。
issue.clean_code_attribute.TRUSTWORTHY.advice=為了可信，程式碼需避免洩漏私人資訊或將其寫死在程式碼中。
clean_code_attribute.learn_more=進一步了解 Clean Code
